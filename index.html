<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ping Pong Live Scoreboard</title>
    <!-- This library generates QR codes locally and offline on the phone -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0; padding: 0;
            background-color: #121212; color: white;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; overflow: hidden;
        }
        .setup-screen { display: flex; flex-direction: column; gap: 12px; text-align: center; width: 85%; max-width: 350px; align-items: center; }
        .game-screen { display: none; flex-direction: column; align-items: center; width: 100%; }
        .score-board { display: flex; justify-content: space-around; width: 100%; max-width: 600px; margin-bottom: 20px; }
        .player-box { text-align: center; width: 45%; padding: 15px; border-radius: 10px; transition: all 0.3s; }
        .serving { background-color: #1e272e; border: 2px solid #3498db; }
        .player-name { font-size: 1.4rem; color: #fff; font-weight: bold; }
        .sets-won { font-size: 1.5rem; color: #f1c40f; font-weight: bold; margin-top: 5px; }
        .score { font-size: 6rem; font-weight: bold; margin: 5px 0; }
        .service-indicator { font-size: 2rem; height: 40px; }
        .controls { display: flex; flex-direction: column; gap: 15px; width: 80%; max-width: 400px; }
        button { padding: 20px; font-size: 1.3rem; font-weight: bold; border: none; border-radius: 10px; cursor: pointer; width: 100%; }
        .btn-plus { background-color: #2ecc71; color: white; height: 120px; font-size: 2rem; }
        .btn-minus { background-color: #e74c3c; color: white; }
        .btn-reset { background-color: #7f8c8d; color: white; margin-top: 10px; }
        input { padding: 15px; font-size: 1.2rem; border-radius: 8px; border: none; text-align: center; background-color: #2c3e50; color: white; width: 100%; box-sizing: border-box; }
        .winner-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.9); flex-direction: column;
            align-items: center; justify-content: center; z-index: 10;
        }
        .winner-text { font-size: 2.5rem; color: #f1c40f; font-weight: bold; text-align: center; margin-bottom: 30px; }
        hr { border: 0; height: 1px; background: #34495e; margin: 15px 0; width: 100%; }
        #qrcode { background: white; padding: 10px; border-radius: 8px; display: inline-block; margin-top: 10px; }
    </style>
</head>
<body>

<!-- START SCREEN -->
<div id="setupScreen" class="setup-screen">
    <h2>Ping Pong Match</h2>
    <input type="text" id="nameInput" placeholder="Your name" maxlength="12">
    <hr>
    <button id="btnCreate" onclick="createRoom()" style="background-color: #3498db; color: white;">Start Game</button>

    <div id="qrContainer" style="display:none; margin: 15px 0; text-align: center; width: 100%;">
        <p style="color: #3498db; font-weight: bold; margin-bottom: 10px;">Opponent must scan this QR code:</p>
        <!-- The library draws the QR code right here -->
        <div id="qrcode"></div>

        <p style="margin: 15px 0 5px; color: #aaa;">OR</p>
        <p style="color: #9b59b6; font-weight: bold; margin-bottom: 8px;">Enter link manually:</p>
        <div style="display: flex; gap: 8px; align-items: center;">
            <div id="joinLinkDisplay" style="flex: 1; word-break: break-all; text-align: left; font-size: 0.85rem; color: #ddd; background-color: #2c3e50; padding: 10px; border-radius: 8px;"></div>
            <button type="button" onclick="shareJoinLink()" title="Share" style="width: auto; padding: 10px 14px; font-size: 0.9rem;">📤</button>
        </div>
    </div>
    <h3 id="statusText" style="margin-top: 15px; padding: 0 10px;"></h3>
</div>

<!-- GAME SCREEN -->
<div id="gameScreen" class="game-screen">
    <div class="score-board">
        <div id="boxA" class="player-box">
            <div id="serviceA" class="service-indicator"></div>
            <div id="nameA" class="player-name">Player A</div>
            <div id="setsA" class="sets-won">Sets: 0</div>
            <div id="scoreA" class="score">0</div>
        </div>
        <div id="boxB" class="player-box">
            <div id="serviceB" class="service-indicator"></div>
            <div id="nameB" class="player-name">Player B</div>
            <div id="setsB" class="sets-won">Sets: 0</div>
            <div id="scoreB" class="score">0</div>
        </div>
    </div>

    <div class="controls">
        <button class="btn-plus" onclick="addPoint()">+ Point for me</button>
        <button class="btn-minus" onclick="removePoint()">- My error</button>
        <button class="btn-reset" onclick="confirmResetMatch()">Reset Match</button>
    </div>
</div>

<!-- WINNER SCREEN OVERLAY -->
<div id="winnerOverlay" class="winner-overlay">
    <div id="winnerText" class="winner-text">WINNER!</div>
    <button onclick="closeOverlayAndReset()" style="background-color: #2ecc71; color: white; padding: 20px 40px; width: auto;">Start New Match</button>
</div>

<!-- NOTICE BANNER -->
<div id="backBlockedBanner" style="display:none; position:fixed; top:0; left:0; width:100%; padding:12px; box-sizing:border-box; background-color:#e74c3c; color:white; text-align:center; font-weight:bold; z-index:20;">
    Back navigation is not possible during the game.
</div>
<script>
    let scoreA = 0; let scoreB = 0;
    let setsA = 0;  let setsB = 0;
    let nameA = "Player A"; let nameB = "Player B";
    let matchFinished = false;
    let myRole = ''; let ws; let roomCode = '';
    let wakeLock = null;

    // REPLACE THIS WITH THE LOCAL IP OF YOUR PHP SERVER (e.g. ws://192.168.1.50:8080)
    const WEBSOCKET_SERVER = "ws://192.168.0.101:9999";

    async function requestWakeLock() {
        try {
            if ('wakeLock' in navigator) {
                wakeLock = await navigator.wakeLock.request('screen');
            }
        } catch (err) {}
    }

    document.addEventListener('visibilitychange', async () => {
        if (wakeLock !== null && document.visibilityState === 'visible') {
            await requestWakeLock();
        }
    });

    window.addEventListener('load', () => {
        const urlParams = new URLSearchParams(window.location.search);
        const autoRoom = urlParams.get('g');

        if (autoRoom) {
            roomCode = autoRoom;
            myRole = 'B';

            document.getElementById('btnCreate').style.display = 'none';

            document.getElementById('statusText').innerText = "Scan successful! Enter your name. Starting in 5 seconds...";
            document.getElementById('statusText').style.color = "#2ecc71";

            setTimeout(() => {
                const inputName = document.getElementById('nameInput').value.trim();
                if(inputName) nameB = inputName;

                initWebSocket(() => {
                    ws.send(JSON.stringify({
                        type: "sync", room: roomCode, sender: 'B',
                        nameA, nameB, scoreA, scoreB, setsA, setsB, matchFinished
                    }));
                    startGame();
                });
            }, 5000);
        }
    });

    function initWebSocket(callback) {
        ws = new WebSocket(WEBSOCKET_SERVER);
        ws.onopen = () => callback();
        ws.onmessage = (event) => {
            try {
                const data = JSON.parse(event.data);

                if (data.error === "game_in_progress") {
                    const status = document.getElementById('statusText');
                    status.innerText = "❌ Access denied: Game already started!";
                    status.style.color = "#e74c3c";
                    ws.close();
                    return;
                }

                if (data.type === "opponent_left" && data.room === roomCode) {
                    alert("The opponent has left the game.");
                    returnToSetup();
                    return;
                }

                if (data.room === roomCode && data.sender !== myRole) {
                    if (data.type === "sync" || data.type === "update") {
                        scoreA = data.scoreA; scoreB = data.scoreB;
                        setsA = data.setsA;   setsB = data.setsB;
                        // Only adopt the name of the OTHER player –
                        // our own, self-entered name stays untouched.
                        if (myRole === 'A') { nameB = data.nameB; } else { nameA = data.nameA; }
                        matchFinished = data.matchFinished;

                        if (data.type === "sync") {
                            startGame();
                            sendData(); // immediately mirror back our own (real) name
                        } else {
                            updateDisplay();
                        }
                    }
                }
            } catch (e) {}
        };
    }

    function createRoom() {
        const inputName = document.getElementById('nameInput').value.trim();
        if(inputName) nameA = inputName;
        myRole = 'A';

        roomCode = "PP-" + Math.floor(100000 + Math.random() * 900000).toString();

        const currentUrl = window.location.href.split('?');
        const joinUrl = `${currentUrl[0]}?g=${roomCode}`;

        initWebSocket(() => {
            // Registers this connection in the room on the server side
            ws.send(JSON.stringify({
                type: "join", room: roomCode, sender: 'A',
                nameA, nameB, scoreA, scoreB, setsA, setsB, matchFinished
            }));

            // Clears old QR codes if present
            document.getElementById('qrcode').innerHTML = "";

            // Creates the QR code entirely locally on the device
            new QRCode(document.getElementById("qrcode"), {
                text: joinUrl,
                width: 200,
                height: 200
            });

            document.getElementById('joinLinkDisplay').textContent = joinUrl;

            document.getElementById('qrContainer').style.display = 'block';
            document.getElementById('statusText').innerText = "Waiting for opponent...";
            document.getElementById('statusText').style.color = "#3498db";
        });
    }

    async function shareJoinLink() {
        const url = document.getElementById('joinLinkDisplay').textContent;
        if (navigator.share) {
            try {
                await navigator.share({ title: 'Ping Pong Match', url });
            } catch (err) {}
        } else {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(url);
            }
            alert("Sharing is not supported on this device. The link was copied to the clipboard instead.");
        }
    }

    function returnToSetup() {
        if (ws) { ws.close(); ws = null; }
        scoreA = 0; scoreB = 0; setsA = 0; setsB = 0; matchFinished = false;
        nameA = "Player A"; nameB = "Player B";
        myRole = ''; roomCode = '';

        document.getElementById('winnerOverlay').style.display = 'none';
        document.getElementById('gameScreen').style.display = 'none';
        document.getElementById('setupScreen').style.display = 'flex';

        document.getElementById('btnCreate').style.display = 'block';
        document.getElementById('qrContainer').style.display = 'none';
        document.getElementById('statusText').innerText = "";
    }

    function startGame() {
        document.getElementById('setupScreen').style.display = 'none';
        document.getElementById('gameScreen').style.display = 'flex';
        requestWakeLock();
        updateDisplay();
        for (let i = 0; i < 20; i++) {
            history.pushState({ppcGame: true}, '', '');
        }
    }

    let backBlockedTimeout = null;

    function showBackBlockedBanner() {
        const banner = document.getElementById('backBlockedBanner');
        banner.style.display = 'block';
        clearTimeout(backBlockedTimeout);
        backBlockedTimeout = setTimeout(() => { banner.style.display = 'none'; }, 2000);
    }

    window.addEventListener('popstate', () => {
        const inGame = document.getElementById('gameScreen').style.display === 'flex';
        if (inGame) {
            history.pushState({ppcGame: true}, '', '');
            showBackBlockedBanner();
        }
    });

    function checkSetAndMatchProgress() {
        if (scoreA >= 11 && (scoreA - scoreB) >= 2) {
            setsA++; scoreA = 0; scoreB = 0;
        } else if (scoreB >= 11 && (scoreB - scoreA) >= 2) {
            setsB++; scoreA = 0; scoreB = 0;
        }
        if (setsA === 3 || setsB === 3) {
            matchFinished = true;
        }
    }

    function addPoint() {
        if (matchFinished) return;
        if (myRole === 'A') scoreA++;
        else scoreB++;
        checkSetAndMatchProgress();
        sendData();
    }

    function removePoint() {
        if (matchFinished) return;
        if (myRole === 'A' && scoreA > 0) scoreA--;
        else if (myRole === 'B' && scoreB > 0) scoreB--;
        sendData();
    }

    function confirmResetMatch() {
        if (confirm("Really reset the match?")) {
            resetFullMatch();
        }
    }

    function resetFullMatch() {
        scoreA = 0; scoreB = 0; setsA = 0; setsB = 0; matchFinished = false;
        sendData();
    }

    function closeOverlayAndReset() {
        document.getElementById('winnerOverlay').style.display = 'none';
        resetFullMatch();
    }

    function sendData() {
        updateDisplay();
        if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({
                type: "update", room: roomCode, sender: myRole,
                nameA, nameB, scoreA, scoreB, setsA, setsB, matchFinished
            }));
        }
    }

    function updateDisplay() {
        document.getElementById('nameA').innerText = nameA + (myRole === 'A' ? " (Me)" : "");
        document.getElementById('nameB').innerText = nameB + (myRole === 'B' ? " (Me)" : "");
        document.getElementById('scoreA').innerText = scoreA;
        document.getElementById('scoreB').innerText = scoreB;
        document.getElementById('setsA').innerText = `Sets: ${setsA}`;
        document.getElementById('setsB').innerText = `Sets: ${setsB}`;

        const totalPoints = scoreA + scoreB;
        let isPlayerAServing = true;
        if (scoreA >= 10 && scoreB >= 10) {
            isPlayerAServing = (totalPoints % 2 === 0);
        } else {
            isPlayerAServing = (Math.floor(totalPoints / 2) % 2 === 0);
        }

        if (isPlayerAServing) {
            document.getElementById('serviceA').innerText = "🏓"; document.getElementById('serviceB').innerText = "";
            document.getElementById('boxA').classList.add('serving'); document.getElementById('boxB').classList.remove('serving');
        } else {
            document.getElementById('serviceA').innerText = ""; document.getElementById('serviceB').innerText = "🏓";
            document.getElementById('boxA').classList.remove('serving'); document.getElementById('boxB').classList.add('serving');
        }

        const overlay = document.getElementById('winnerOverlay');
        if (matchFinished) {
            const text = document.getElementById('winnerText');
            const winnerName = setsA === 3 ? nameA : nameB;
            text.innerText = `🏆 MATCH OVER 🏆\n${winnerName} wins the match ${setsA}:${setsB}!`;
            overlay.style.display = 'flex';
        } else {
            overlay.style.display = 'none';
        }
    }
</script>
</body>
</html>
