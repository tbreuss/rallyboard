<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ping Pong Pro Zähler</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="menu">
    <button id="btn-reset">Reset</button>
    <button id="btn-switch">Tauschen</button>
</div>

<div id="field" class="playing-field">
    <div id="side-left" class="side serving">
        <div class="ball">🏓</div>
        <div id="sets-p1" class="sets">0</div>
        <div id="points-p1" class="points">0</div>
    </div>
    <div id="side-right" class="side">
        <div class="ball">🏓</div>
        <div id="sets-p2" class="sets">0</div>
        <div id="points-p2" class="points">0</div>
    </div>
</div>

<div id="overlay">
    <div id="overlay-text"></div>
    <button id="btn-new-match">Neues Spiel</button>
</div>

<script src="script.js"></script>
</body>
</html>
