<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ping Pong Pro Zähler</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="config-screen">
    <h2>Einstellungen</h2>
    <div class="config-group">
        <p>Punkte pro Satz</p>
        <div class="config-options">
            <button class="config-option selected" data-points="11">11</button>
            <button class="config-option" data-points="21">21</button>
        </div>
    </div>
    <div class="config-group">
        <p>Sätze</p>
        <div class="config-options">
            <button class="config-option" data-sets="2">Best of 3</button>
            <button class="config-option selected" data-sets="3">Best of 5</button>
            <button class="config-option" data-sets="4">Best of 7</button>
        </div>
    </div>
    <button id="btn-apply-settings">Übernehmen</button>
</div>

<div id="menu">
    <button id="btn-menu">☰</button>
    <div id="menu-dropdown">
        <button id="btn-settings">Optionen</button>
        <button id="btn-reset">Reset</button>
        <button id="btn-switch">Tauschen</button>
    </div>
</div>

<div id="field" class="playing-field">
    <div id="side-left" class="side serving">
        <div class="ball">🏓</div>
        <div id="sets-p1" class="sets">0</div>
        <div id="points-p1" class="points">0</div>
    </div>
    <div id="side-right" class="side">
        <div class="ball">🏓</div>
        <div id="sets-p2" class="sets">0</div>
        <div id="points-p2" class="points">0</div>
    </div>
</div>

<div id="overlay">
    <div id="overlay-text"></div>
    <button id="btn-new-match">Neues Spiel</button>
</div>

<script src="script.js"></script>
</body>
</html>
